services:
  - type: web
    name: ipl-auction
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        value: "postgres"
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSL
        value: "require"
