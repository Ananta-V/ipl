<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPL Auction 2026</title>
<link rel="stylesheet" href="app.css">
<style>
  /* ===== Broadcast Auction — Professional Stadium Blue Design System ===== */
  :root {
    --bg: #070c18;
    --bg2: #0b1426;
    --panel: #101b33;
    --panel2: #162444;
    --elev: #1c2e56;
    --line: #223766;
    --line2: #2e4a8a;
    --ink: #f0f4ff;
    --mut: #8da2cf;
    --dim: #556b9c;
    --gold: #f5c542;
    --gold-2: #d89b00;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3b82f6;
    --cyan: #4cc9f0;
    --border-blue: 1px solid rgba(76, 201, 240, 0.28);
  }

  /* Completely suppress connection badge (removes any "Live" in top right) */
  .conn { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #070c18 !important;
  }

  body {
    background: #070c18 !important;
    color: var(--ink);
    font-family: var(--f-body);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 0;
    position: relative;
  }

  /* ===== TOP-LEFT BRAND & AUCTION METRICS (NO PILLS, STACKED) ===== */
  .brand-block {
    position: absolute;
    top: 14px;
    left: 20px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  /* Dual Logo Header: IPL + E-Cell (Enlarged) */
  .brand-logos {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-logo {
    height: clamp(74px, 9.6vh, 98px);
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.85));
    display: block;
  }

  .brand-divider {
    width: 2px;
    height: clamp(52px, 6.8vh, 72px);
    background: linear-gradient(180deg, transparent, rgba(76, 201, 240, 0.45), transparent);
  }

  /* Stacked Rectangular Metrics Table (SOLD : X / UNSOLD : Y / REMAINING : Z) */
  .auction-metrics {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: rgba(9, 17, 34, 0.88);
    border: 1px solid rgba(76, 201, 240, 0.3);
    border-radius: 4px;
    padding: 8px 14px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    min-width: 175px;
  }

  .metric-row {
    display: grid;
    grid-template-columns: 82px 12px 1fr;
    align-items: center;
  }

  .metric-label {
    font-family: var(--f-head);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--mut);
    text-transform: uppercase;
  }

  .metric-colon {
    font-family: var(--f-head);
    font-size: 13px;
    font-weight: 700;
    color: var(--dim);
    text-align: center;
  }

  .metric-val {
    font-family: var(--f-display);
    font-size: 19px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-align: right;
    letter-spacing: .5px;
  }
  .metric-val.sold { color: #2ecc71; }
  .metric-val.unsold { color: #e74c3c; }
  .metric-val.rem { color: var(--gold); }

  .unsold-banner {
    font-family: var(--f-head);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
    background: #e74c3c;
    padding: 4px 8px;
    text-align: center;
    border-radius: 2px;
    margin-top: 4px;
  }

  /* ===== TOP-RIGHT COUNTDOWN CLOCK ===== */
  .cornerTimer {
    position: absolute;
    top: 14px;
    right: 22px;
    text-align: center;
    z-index: 20;
  }
  .cornerTimer .ring {
    width: clamp(74px, 9vh, 98px);
    height: clamp(74px, 9vh, 98px);
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
    background: conic-gradient(var(--gold) calc(var(--p)*1%), #122144 0);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .cornerTimer .ring::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: #081122;
  }
  .cornerTimer .ring b {
    position: relative;
    font-family: var(--f-display);
    font-size: clamp(28px, 4.4vh, 42px);
    color: var(--ink);
  }
  .cornerTimer .ctlbl {
    font-family: var(--f-head);
    font-size: 10.5px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #7fb6d6;
    margin-top: 4px;
    font-weight: 700;
  }

  /* ===== CENTRAL STAGE ===== */
  .mid {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 10px 24px;
  }

  /* Stadium blue subtle ambient strictly in center behind player */
  .mid::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 36%;
    transform: translate(-50%, -50%);
    width: min(85vh, 650px);
    height: min(85vh, 650px);
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle, rgba(16, 28, 56, 0.45) 0%, transparent 70%);
  }

  /* Center Player Card Container — Dead Centered */
  .bcast {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(860px, calc(100vw - 380px));
    margin: 0 auto;
    transition: width .2s ease;
  }

  /* HERO PLAYER PROFILE PIC (LARGE SIZE & DEAD CENTERED) */
  .halo {
    position: relative;
    display: grid;
    place-items: center;
    flex: none;
    margin: 0 auto;
  }
  .halo.big {
    width: clamp(280px, 42vh, 460px);
    height: clamp(280px, 42vh, 460px);
    margin-bottom: clamp(-66px, -7.5vh, -44px);
    z-index: 3;
  }
  .pphoto {
    border-radius: 50%;
    border: none;
    position: relative;
    z-index: 2;
    background: linear-gradient(160deg, #122040, #0a1020);
    box-shadow:
      0 0 0 4px rgba(7, 12, 24, 0.95),
      0 0 0 6px rgba(245, 197, 66, 0.6),
      0 16px 44px rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .halo .pphoto {
    width: 82%;
    height: 82%;
  }
  .pphoto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
    display: block;
  }
  .pavatar {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border-radius: 50%;
  }
  .pavatar.sil {
    opacity: 1;
    background: linear-gradient(165deg, #132247 0%, #071021 100%);
  }
  .player-sil-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Rotating Broadcast Rings */
  .halo .hring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .halo .r1 {
    inset: 0;
    border: 2px dashed rgba(76, 201, 240, 0.4);
    animation: spin 20s linear infinite;
  }
  .halo .r2 {
    inset: 7%;
    border: 2px dotted rgba(245, 197, 66, 0.55);
    animation: spin 14s linear infinite reverse;
  }
  .halo .r3 {
    inset: -5%;
    animation: spin 8s linear infinite;
    filter: blur(.3px);
    background: conic-gradient(from 0deg, transparent 0 55deg, rgba(76, 201, 240, 0.6) 75deg, transparent 95deg 235deg, rgba(245, 197, 66, 0.6) 255deg, transparent 275deg);
    -webkit-mask: radial-gradient(closest-side, transparent 79%, #000 81%);
    mask: radial-gradient(closest-side, transparent 79%, #000 81%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Broadcast Lower-Third Bar (Strictly Symmetrical Left & Right so Center Column is Dead Center) */
  .bcbar {
    display: grid;
    grid-template-columns: 1fr 1.7fr 1fr;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(76, 201, 240, 0.32);
    background: linear-gradient(180deg, #0e1e3b, #091326);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }
  .bcpanel {
    padding: clamp(14px, 2vh, 20px) clamp(10px, 1.2vw, 18px);
    text-align: center;
    position: relative;
    min-width: 0;
  }
  .bcpanel.side {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .bcpanel.center {
    padding-top: clamp(56px, 8vh, 88px);
    background: rgba(9, 19, 38, 0.6);
    border-left: 1px solid rgba(76, 201, 240, 0.2);
    border-right: 1px solid rgba(76, 201, 240, 0.2);
  }
  .bcpanel.right {
    background: linear-gradient(180deg, rgba(245, 197, 66, 0.12), rgba(9, 19, 38, 0.55));
  }

  .bck {
    font-family: var(--f-head);
    font-size: clamp(11px, 1.15vw, 14px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7fb6d6;
    font-weight: 700;
  }
  .bcv {
    font-family: var(--f-display);
    font-size: clamp(26px, 3.8vw, 50px);
    line-height: 1;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .bcv.gold {
    background: linear-gradient(120deg, #ffffff 20%, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .bcpanel.center .pname {
    font-family: var(--f-head);
    font-size: clamp(22px, 2.9vw, 42px);
    font-weight: 700;
    line-height: .98;
    margin: 0;
    text-wrap: balance;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: #fff;
  }
  .bcpanel.center .pmeta {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }

  /* Rectangular Tags (No Rounded Pills) */
  .pmeta .tag {
    font-family: var(--f-head);
    font-size: clamp(11px, 1vw, 13px);
    padding: 3px 8px;
    border-radius: 3px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
  }

  /* Leading Bidder Block with Team Logo */
  .lead-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    min-height: 42px;
    max-width: 100%;
  }
  .lead-logo-img {
    width: clamp(40px, 3.6vw, 48px);
    height: clamp(40px, 3.6vw, 48px);
    border-radius: 6px;
    object-fit: contain;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.6);
    border: 2px solid var(--gold);
    background: #060b17;
    padding: 2px;
    flex: none;
  }
  .lead-text-wrap {
    text-align: left;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .lead-sub {
    font-family: var(--f-head);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #7fb6d6;
    font-weight: 700;
  }
  .leadmini {
    font-family: var(--f-head);
    font-size: clamp(13px, 1.25vw, 17px);
    color: #fff;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Player Stats Strip */
  .statstrip {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(76, 201, 240, 0.22);
    background: #0b1a33;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    max-width: 100%;
  }
  .statstrip .cell {
    padding: 6px 14px;
    font-family: var(--f-head);
    border-right: 1px solid rgba(76, 201, 240, 0.16);
    display: flex;
    gap: 7px;
    align-items: baseline;
  }
  .statstrip .cell:last-child {
    border-right: none;
  }
  .statstrip .cell .k {
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #7fb6d6;
    font-weight: 700;
  }
  .statstrip .cell .v {
    font-size: clamp(13px, 1.3vw, 16px);
    color: var(--ink);
    font-weight: 700;
  }

  .lastside {
    margin-top: 8px;
    color: var(--mut);
    font-family: var(--f-head);
    font-size: clamp(12px, 1.1vw, 14px);
    letter-spacing: .5px;
    text-align: center;
  }
  .lastside b {
    color: var(--gold);
  }

  /* ===== PROFESSIONAL BID ACTIVITY PANEL (RIGHT SIDE, NO PILLS, NO JITTER) ===== */
  .bid-history-card {
    position: absolute;
    top: clamp(96px, 14vh, 126px);
    right: 22px;
    bottom: 16px;
    width: clamp(260px, 20vw, 300px);
    background: rgba(11, 20, 38, 0.92);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(76, 201, 240, 0.3);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
    z-index: 15;
  }
  .bh-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(76, 201, 240, 0.08);
    border-bottom: 1px solid rgba(76, 201, 240, 0.2);
  }
  .bh-title {
    font-family: var(--f-head);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .bh-count {
    font-family: var(--f-head);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 3px;
    background: rgba(245, 197, 66, 0.15);
    border: 1px solid rgba(245, 197, 66, 0.4);
    color: var(--gold);
  }
  .bh-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bh-list::-webkit-scrollbar {
    width: 4px;
  }
  .bh-list::-webkit-scrollbar-thumb {
    background: rgba(76, 201, 240, 0.3);
    border-radius: 2px;
  }

  /* Sharp rectangular bid rows (no pills, stable without heartbeat jump) */
  .bh-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 9px;
    background: rgba(14, 25, 48, 0.65);
    border: 1px solid rgba(76, 201, 240, 0.16);
    border-radius: 4px;
  }
  .bh-item.latest {
    background: linear-gradient(90deg, rgba(245, 197, 66, 0.16), rgba(14, 25, 48, 0.85));
    border-color: rgba(245, 197, 66, 0.6);
  }

  .bh-logo {
    width: 32px;
    height: 32px;
    border-radius: 4px;
    object-fit: cover;
    flex: none;
    background: #090e1c;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .bh-logo-fallback {
    display: grid;
    place-items: center;
    font-family: var(--f-display);
    font-size: 13px;
    font-weight: 800;
  }
  .bh-info {
    flex: 1;
    min-width: 0;
  }
  .bh-team-name {
    font-family: var(--f-head);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-transform: uppercase;
  }
  .bh-amount {
    font-family: var(--f-display);
    font-size: 16px;
    color: var(--gold);
    line-height: 1.1;
    letter-spacing: .4px;
  }
  .bh-badge {
    font-family: var(--f-head);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    background: rgba(46, 204, 113, 0.18);
    border: 1px solid rgba(46, 204, 113, 0.5);
    color: #7ee2a8;
    flex: none;
  }
  .bh-num {
    font-family: var(--f-head);
    font-size: 11px;
    color: var(--dim);
    font-weight: 700;
  }
  .bh-empty {
    margin: auto;
    text-align: center;
    padding: 24px 14px;
    color: var(--dim);
  }
  .bh-empty-text {
    font-family: var(--f-head);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Responsive collapse on smaller displays */
  @media (max-width: 1200px) {
    .bid-history-card {
      display: none;
    }
    .bcast {
      width: min(920px, 94vw);
    }
  }

  /* ===== BOTTOM FRANCHISES BAR ===== */
  .teams {
    display: flex;
    gap: 9px;
    padding: 10px 18px 14px;
    overflow-x: auto;
    border-top: 1px solid rgba(76, 201, 240, 0.22);
    background: linear-gradient(180deg, rgba(8, 15, 32, 0.75), rgba(5, 10, 22, 0.98));
    position: relative;
    z-index: 10;
  }
  .tcard {
    min-width: 148px;
    flex: 1;
    border-radius: 4px;
    border: 1px solid rgba(76, 201, 240, 0.18);
    padding: 9px 12px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #131f3c, #0a1326);
    transition: border-color .2s;
  }
  .tcard::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: var(--tc, transparent);
  }
  .tcard.lead {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(245, 197, 66, 0.5), 0 0 20px rgba(245, 197, 66, 0.25);
  }
  .tcard .tn {
    font-family: var(--f-head);
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: .3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tcard-logo {
    width: 22px;
    height: 22px;
    border-radius: 3px;
    object-fit: cover;
    flex: none;
    background: #090e1c;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .tcard .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex: none;
  }
  .tcard .onl {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
    background: var(--dim);
  }
  .tcard .onl.on {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .tcard .rem {
    font-family: var(--f-display);
    font-size: 22px;
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--ink);
  }
  .tcard.lead .rem {
    color: var(--gold);
  }
  .tcard .sub {
    font-size: 10.5px;
    color: var(--mut);
    margin-top: 4px;
    font-weight: 600;
  }

  /* ===== SOLD FULL-SCREEN SPLASH CELEBRATION & ROSTER TRANSITION ===== */
  .soldsplash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: radial-gradient(circle at center, rgba(14, 28, 60, 0.98), rgba(4, 8, 18, 0.99));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .soldsplash.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* Close button */
  .sp-close-btn {
    position: absolute;
    top: 18px;
    right: 22px;
    z-index: 100;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: var(--mut);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .sp-close-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    transform: scale(1.08);
  }

  /* Stage switcher pills */
  .sp-nav-pills {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 8px;
    background: rgba(8, 16, 34, 0.92);
    border: 1px solid rgba(76, 201, 240, 0.3);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(12px);
  }
  .sp-pill-btn {
    background: transparent;
    border: none;
    color: var(--mut);
    font-family: var(--f-head);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .sp-pill-btn.active {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #0b1220;
    box-shadow: 0 2px 10px rgba(245, 197, 66, 0.35);
  }
  .sp-pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  /* Stage container & crossfade/slide mechanics */
  .sp-stage-container {
    position: relative;
    width: min(1420px, 96vw);
    max-height: 94vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .sp-stage {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(24px) scale(0.97);
    filter: blur(6px);
    pointer-events: none;
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    position: absolute;
    inset: 0;
  }
  .sp-stage.active {
    position: relative;
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
    pointer-events: auto;
  }
  .sp-stage.leave-prev {
    opacity: 0;
    transform: translateY(-24px) scale(0.97);
    filter: blur(6px);
    pointer-events: none;
  }

  /* STAGE 1: SOLD announcement card */
  .sp-stage-sold .inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: min(1.8vh, 14px);
    max-height: 100vh;
    padding: min(2vh, 18px) 16px;
  }
  .soldsplash .stamp {
    font-family: var(--f-display);
    font-size: min(12vw, 13vh);
    letter-spacing: 4px;
    line-height: 1;
    color: var(--gold);
    border: 6px solid var(--gold);
    border-radius: 8px;
    padding: .04em .34em;
    animation: stamp .45s cubic-bezier(.2, 1.4, .4, 1);
  }
  .soldsplash .stamp.unsold {
    color: var(--red);
    border-color: var(--red);
  }
  .soldsplash .stamp.skipped {
    color: var(--mut);
    border-color: var(--mut);
  }
  .soldsplash .sp-sub {
    font-size: min(3.2vw, 3.4vh);
    color: var(--mut);
    font-weight: 800;
  }
  @keyframes stamp {
    0% { transform: scale(1.6); opacity: 0; }
    60% { transform: scale(.94); }
    100% { transform: scale(1); opacity: 1; }
  }
  .soldsplash .sp-name {
    font-family: var(--f-head);
    font-weight: 700;
    font-size: min(5.6vw, 6vh);
    line-height: 1;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .sp-team-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(9, 17, 34, 0.94);
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 10px 24px;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.7);
    margin: 4px 0;
  }
  .sp-team-logo {
    width: clamp(74px, 11vh, 106px);
    height: clamp(74px, 11vh, 106px);
    border-radius: 8px;
    object-fit: contain;
    background: #060b17;
    border: 2px solid rgba(255, 255, 255, 0.15);
    padding: 4px;
    display: block;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
  }
  .sp-team-name-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 2px;
  }
  .soldsplash .sp-to {
    font-size: min(2vw, 2.2vh);
    color: #7fb6d6;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 800;
  }
  .soldsplash .sp-team {
    font-family: var(--f-head);
    font-weight: 700;
    font-size: min(4.6vw, 5vh);
    line-height: 1;
    text-transform: uppercase;
    color: var(--gold);
  }
  .soldsplash .sp-price {
    font-family: var(--f-display);
    font-size: min(9vw, 10vh);
    line-height: 1;
    color: var(--gold);
    background: linear-gradient(120deg, #ffffff 20%, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
  }
  .halo.splash-halo {
    width: clamp(190px, 28vh, 250px);
    height: clamp(190px, 28vh, 250px);
    margin: 0 auto;
    position: relative;
    display: grid;
    place-items: center;
    flex: none;
  }

  /* Progress bar indicating automatic switch to Roster */
  .sp-progress-box {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: min(380px, 84vw);
  }
  .sp-progress-hint {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    font-family: var(--f-head);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #7fb6d6;
  }
  .sp-progress-track {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
  }
  .sp-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--gold));
    border-radius: 999px;
    transition: width 0.1s linear;
  }

  /* STAGE 2: ROSTER SHOWCASE */
  .sp-stage-roster {
    width: 100%;
  }
  .sp-roster-card {
    width: 100%;
    background: linear-gradient(165deg, rgba(14, 25, 52, 0.97), rgba(5, 11, 22, 0.99));
    border: 2px solid var(--t-color, rgba(76, 201, 240, 0.45));
    border-radius: 16px;
    padding: clamp(14px, 2vh, 20px) clamp(16px, 2.4vw, 28px);
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85), 0 0 50px rgba(76, 201, 240, 0.15);
    display: flex;
    flex-direction: column;
    gap: 12px;
    backdrop-filter: blur(16px);
  }

  /* Roster Header */
  .sp-roster-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(76, 201, 240, 0.2);
  }
  .sp-roster-team-brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sp-roster-logo {
    width: clamp(62px, 8.5vh, 84px);
    height: clamp(62px, 8.5vh, 84px);
    border-radius: 12px;
    object-fit: contain;
    background: #060b17;
    border: 2px solid var(--t-color, var(--gold));
    padding: 3px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 16px rgba(245, 197, 66, 0.2);
  }
  .sp-roster-title-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 2px;
  }
  .sp-roster-kicker {
    font-family: var(--f-head);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7fb6d6;
  }
  .sp-roster-team-name {
    margin: 0;
    font-family: var(--f-head);
    font-weight: 800;
    font-size: clamp(26px, 3.8vh, 40px);
    line-height: 1;
    text-transform: uppercase;
    color: var(--t-color, var(--gold));
    letter-spacing: 0.5px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.6);
  }

  /* Roster KPI Stat Pills */
  .sp-roster-stats-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sp-roster-stat-pill {
    background: rgba(8, 16, 32, 0.9);
    border: 1px solid rgba(76, 201, 240, 0.25);
    border-radius: 8px;
    padding: 6px 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    min-width: 95px;
  }
  .sp-roster-stat-pill .k {
    font-family: var(--f-head);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--mut);
  }
  .sp-roster-stat-pill .v {
    font-family: var(--f-display);
    font-size: 18px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .sp-roster-stat-pill .v.gold { color: var(--gold); }
  .sp-roster-stat-pill .v.green { color: var(--green); }

  /* Subheader strip with role counts and 8s countdown */
  .sp-roster-subbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .sp-roster-breakdown {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-family: var(--f-head);
    font-size: 11.5px;
    font-weight: 700;
  }
  .sp-role-chip {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .sp-roster-progress-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 220px;
  }
  .sp-roster-timer-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--f-head);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #7fb6d6;
    white-space: nowrap;
  }
  .sp-roster-timer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px var(--gold);
  }
  .sp-roster-progress-track {
    flex: 1;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
    min-width: 80px;
  }
  .sp-roster-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), #ff8c00);
    border-radius: 999px;
    transition: width 0.1s linear;
  }

  /* Roster Cards Grid & Scroll Container */
  .sp-roster-scroll-wrap {
    max-height: min(58vh, 520px);
    overflow-y: auto;
    padding: 6px 8px 16px 2px;
  }
  .sp-roster-scroll-wrap::-webkit-scrollbar {
    width: 7px;
  }
  .sp-roster-scroll-wrap::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.04);
    border-radius: 4px;
  }
  .sp-roster-scroll-wrap::-webkit-scrollbar-thumb {
    background: var(--t-color, rgba(76, 201, 240, 0.45));
    border-radius: 4px;
  }
  .sp-roster-scroll-wrap::-webkit-scrollbar-thumb:hover {
    background: var(--gold);
  }

  /* Broadcast Card Grid */
  .sp-roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
    gap: 14px;
  }

  /* BIG PROFILE PICTURE PLAYER CARDS */
  .sp-player-card {
    background: linear-gradient(170deg, rgba(16, 28, 54, 0.94), rgba(7, 13, 26, 0.98));
    border: 1.5px solid rgba(76, 201, 240, 0.22);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
  }
  .sp-player-card:hover {
    transform: translateY(-4px);
    border-color: rgba(76, 201, 240, 0.6);
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7), 0 0 18px rgba(76, 201, 240, 0.2);
  }

  /* Highlight for newly acquired player */
  .sp-player-card.new-signing {
    border: 2px solid var(--gold);
    background: linear-gradient(170deg, rgba(30, 48, 92, 0.98), rgba(12, 22, 45, 0.99));
    box-shadow: 0 0 32px rgba(245, 197, 66, 0.45), inset 0 0 18px rgba(245, 197, 66, 0.15);
    animation: newSigningPulse 2.4s infinite ease-in-out;
  }
  @keyframes newSigningPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(245, 197, 66, 0.35); }
    50% { box-shadow: 0 0 38px rgba(245, 197, 66, 0.7), inset 0 0 20px rgba(245, 197, 66, 0.22); }
  }

  /* Top banner for new signing */
  .sp-card-new-ribbon {
    width: 100%;
    background: linear-gradient(135deg, #ffd700, #ff9900);
    color: #0b1120;
    font-family: var(--f-head);
    font-weight: 800;
    font-size: 9.5px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 3px 6px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    z-index: 8;
  }

  /* Large Portrait Frame */
  .sp-player-card-media {
    position: relative;
    width: 100%;
    height: 155px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #060d1c;
  }
  .sp-player-photo-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  .sp-player-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    transition: transform 0.25s ease;
  }
  .sp-player-card:hover .sp-player-photo-wrap img {
    transform: scale(1.05);
  }
  .sp-player-photo-wrap svg.player-sil-svg {
    width: 80%;
    height: 94%;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  /* Overlaid Badge Row */
  .sp-card-badges {
    position: absolute;
    top: 6px;
    left: 6px;
    right: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 6;
    pointer-events: none;
  }
  .sp-card-role-badge {
    font-family: var(--f-head);
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .sp-card-os-badge {
    background: rgba(76, 201, 240, 0.25);
    border: 1px solid rgba(76, 201, 240, 0.6);
    color: #85d8ff;
    font-family: var(--f-head);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 4px;
    backdrop-filter: blur(8px);
  }

  /* Card Bottom Info */
  .sp-player-card-details {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: rgba(6, 12, 24, 0.7);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    position: relative;
    z-index: 3;
    text-align: left;
  }
  .sp-card-player-name {
    font-family: var(--f-head);
    font-weight: 800;
    font-size: 15px;
    line-height: 1.15;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sp-card-bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .sp-card-country {
    font-size: 11px;
    font-weight: 600;
    color: #7fb6d6;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .sp-card-price {
    font-family: var(--f-display);
    font-size: 16px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }


  /* No-Room Fallback Card */
  .noroom {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    background: radial-gradient(900px 600px at 50% 30%, rgba(20, 30, 70, 0.96), rgba(4, 7, 16, 0.99));
  }
  .noroom .card {
    max-width: 420px;
    background: linear-gradient(160deg, var(--panel), var(--bg2));
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 28px 26px;
  }
  .noroom h2 {
    font-family: var(--f-head);
    margin: 0 0 10px;
  }
  .noroom p {
    color: var(--mut);
    margin: 0 0 18px;
  }
  .noroom a {
    color: var(--gold);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="stage">

  <div class="mid" id="mid">
    <!-- Top-Left Brand Block: Large IPL & ECELL Logos, with Stacked Sold/Unsold/Remaining below -->
    <div class="brand-block">
      <div class="brand-logos">
        <img src="ipl-logo.png" alt="IPL Logo" class="brand-logo ipl-logo" />
        <span class="brand-divider"></span>
        <img src="ecell-logo.png" alt="E-Cell Logo" class="brand-logo ecell-logo" />
      </div>
      <div class="auction-metrics" id="auctionMetrics">
        <div class="metric-row">
          <span class="metric-label">SOLD</span>
          <span class="metric-colon">:</span>
          <span class="metric-val sold" id="mSold">0</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">UNSOLD</span>
          <span class="metric-colon">:</span>
          <span class="metric-val unsold" id="mUnsold">0</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">REMAINING</span>
          <span class="metric-colon">:</span>
          <span class="metric-val rem" id="mLeft">0</span>
        </div>
        <div id="unsoldBanner" class="unsold-banner" style="display:none">UNSOLD ROUND</div>
      </div>
    </div>

    <!-- Top Right Countdown Timer -->
    <div class="cornerTimer">
      <div class="ring" id="ring"><b id="ringnum">—</b></div>
      <div class="ctlbl">on the clock</div>
    </div>

    <!-- Live Bid History Panel (Right Side, No Pills, No Heartbeat Jitter) -->
    <div class="bid-history-card" id="bidHistoryCard">
      <div class="bh-head">
        <span class="bh-title">BID ACTIVITY</span>
        <span class="bh-count" id="bhpCount">0 BIDS</span>
      </div>
      <div class="bh-list" id="bhpList">
        <div class="bh-empty">
          <div class="bh-empty-text">No bids placed yet</div>
        </div>
      </div>
    </div>

    <!-- Main Player Spotlight (Dead Centered with Profile Pic aligned over Player Name) -->
    <div class="bcast">
      <div class="halo big">
        <span class="hring r3"></span><span class="hring r1"></span><span class="hring r2"></span>
        <div class="pphoto" id="pphoto">
          <div class="pavatar sil">
            <svg viewBox="0 0 100 100" class="player-sil-svg" preserveAspectRatio="xMidYMid meet">
              <defs>
                <linearGradient id="silHeadInit" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#e2eeff"/>
                  <stop offset="100%" stop-color="#7294cc"/>
                </linearGradient>
                <linearGradient id="silTorsoInit" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#2d4875"/>
                  <stop offset="100%" stop-color="#111c30"/>
                </linearGradient>
              </defs>
              <path d="M4 100 C6 74 21 57 41 50 L43 43 L57 43 L59 50 C79 57 94 74 96 100 Z" fill="url(#silTorsoInit)"/>
              <path d="M41 50 Q50 63 59 50" fill="none" stroke="rgba(76, 201, 240, 0.6)" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M50 14 C58.8 14 66 21.2 66 30 C66 37.8 60.5 44.2 53.4 45.6 L53.4 46.5 L46.6 46.5 L46.6 45.6 C39.5 44.2 34 37.8 34 30 C34 21.2 41.2 14 50 14 Z" fill="url(#silHeadInit)"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="bcbar">
        <div class="bcpanel side">
          <div class="bck">Base Price</div>
          <div class="bcv" id="baseVal">—</div>
        </div>
        <div class="bcpanel center">
          <div class="pname" id="pname">Waiting for the next player…</div>
          <div class="pmeta" id="pmeta"></div>
        </div>
        <div class="bcpanel side right">
          <div class="bck" id="bckLabel">Current Bid</div>
          <div class="bcv gold" id="bidamt">—</div>
          <div class="lead-box" id="leadBox">
            <img id="leadLogo" class="lead-logo-img" src="" alt="" style="display:none;" />
            <div class="lead-text-wrap">
              <span class="lead-sub" id="leadSub">STATUS</span>
              <div class="leadmini" id="leadteam">Opening bid</div>
            </div>
          </div>
        </div>
      </div>
      <div class="statstrip" id="statStrip"></div>
      <div class="hl" id="hl"></div>
      <div class="lastside" id="lastside"></div>
    </div>
  </div>

  <!-- Bottom Franchises Overview -->
  <div class="teams" id="teams"></div>
</div>

<!-- Full-Screen SOLD / UNSOLD / ROSTER Splash -->
<div class="soldsplash" id="soldsplash">
  <!-- Close Button for quick manual dismiss -->
  <button class="sp-close-btn" id="sp-close-btn" title="Dismiss (or press Esc/Space)">✕</button>

  <!-- Stage Navigation Pills (only visible on SOLD) -->
  <div class="sp-nav-pills" id="sp-nav-pills" style="display:none;">
    <button class="sp-pill-btn active" id="sp-pill-sold" onclick="switchSplashStage('sold')">
      <span class="sp-pill-dot"></span> 🎉 Announcement
    </button>

<script src="bus.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let snap = null;

// ===== Team Logo Catalog & Lookup =====
const TEAM_LOGOS = {
  'CSK': '/teamLogo/ChennaiSuperKings.jpeg',
  'MI': '/teamLogo/MumbaiIndians.jpeg',
  'RCB': '/teamLogo/RCB.jpeg',
  'KKR': '/teamLogo/KolkataKnightRiders.jpeg',
  'RR': '/teamLogo/RajasthanRoyals.jpeg',
  'DC': '/teamLogo/DelhiCapitals.jpeg',
  'SRH': '/teamLogo/SRH.jpeg',
  'GT': '/teamLogo/GujaratTitans.jpeg',
  'PBKS': '/teamLogo/PunjabKings.jpeg',
  'LSG': '/teamLogo/LucknowSuperGiants.jpeg',
};

function getTeamLogo(team) {
  if (team == null) return null;
  if (typeof team === 'number' && snap && snap.teams) {
    team = snap.teams.find(t => Number(t.teamId != null ? t.teamId : t.id) === team) || team;
  }
  const s = String((typeof team === 'object' ? (team.short || team.teamShort || team.name || '') : team) || '').trim().toUpperCase();
  if (TEAM_LOGOS[s]) return TEAM_LOGOS[s];
  const n = String((typeof team === 'object' ? (team.name || team.teamName || team.short || '') : team) || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (n.includes('chennai') || n.includes('csk') || n.includes('superkings')) return TEAM_LOGOS['CSK'];
  if (n.includes('mumbai') || n.includes('mi') || n.includes('indians')) return TEAM_LOGOS['MI'];
  if (n.includes('bangalore') || n.includes('bengaluru') || n.includes('rcb') || n.includes('challengers')) return TEAM_LOGOS['RCB'];
  if (n.includes('kolkata') || n.includes('kkr') || n.includes('knight')) return TEAM_LOGOS['KKR'];
  if (n.includes('rajasthan') || n.includes('rr') || n.includes('royals')) return TEAM_LOGOS['RR'];
  if (n.includes('delhi') || n.includes('dc') || n.includes('capitals')) return TEAM_LOGOS['DC'];
  if (n.includes('hyderabad') || n.includes('srh') || n.includes('sunrisers')) return TEAM_LOGOS['SRH'];
  if (n.includes('gujarat') || n.includes('gt') || n.includes('titans')) return TEAM_LOGOS['GT'];
  if (n.includes('punjab') || n.includes('pbks') || n.includes('kings')) return TEAM_LOGOS['PBKS'];
  if (n.includes('lucknow') || n.includes('lsg') || n.includes('giants')) return TEAM_LOGOS['LSG'];
  return null;
}

// ===== Sound effects strictly disabled per instruction: NEVER auto-play sounds =====
const SFX = {
  bid() {},
  sold() {},
  unsold() {},
  skip() {},
  theme() {}
};

window.toggleSound = () => {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  sndOn = !sndOn;
  try { localStorage.setItem('ipl_snd', sndOn ? '1' : '0'); } catch(e) {}
};

// ===== State & Bid Tracking with Strict Anti-Jitter Memoization =====
let currentSr = null;
let currentBids = [];
let _lastBidsSig = null;

function updateBidHistory(s) {
  const p = s.current;
  const b = s.bidding;
  const listEl = $('bhpList');
  const countEl = $('bhpCount');
  if (!listEl) return;

  if (!p) {
    if (_lastBidsSig !== 'empty') {
      currentSr = null;
      currentBids = [];
      _lastBidsSig = 'empty';
      listEl.innerHTML = `<div class="bh-empty"><div class="bh-empty-text">Waiting for player...</div></div>`;
      if (countEl) countEl.textContent = '0 BIDS';
    }
    return;
  }

  // Reset when player changes
  if (p.sr !== currentSr) {
    currentSr = p.sr;
    currentBids = [];
    _lastBidsSig = null;
  }

  // Synchronize with server bids
  if (b && Array.isArray(b.bids)) {
    for (const item of b.bids) {
      if (!currentBids.some(x => x.id === item.id)) {
        currentBids.push(item);
      }
    }
  }

  // Form a unique signature to prevent heartbeat re-renders
  const curBidL = b ? (b.currentBidL || 0) : 0;
  const leadTid = b ? (b.leadingTeamId || 0) : 0;
  const newSig = `${p.sr}_${currentBids.length}_${curBidL}_${leadTid}`;
  if (newSig === _lastBidsSig) {
    return; // NO DOM TOUCH: prevents heartbeat jitter/animation reset
  }
  _lastBidsSig = newSig;

  if (countEl) {
    countEl.textContent = currentBids.length === 1 ? '1 BID' : `${currentBids.length} BIDS`;
  }

  if (!currentBids.length) {
    listEl.innerHTML = `<div class="bh-empty"><div class="bh-empty-text">No bids placed yet</div></div>`;
    return;
  }

  // Display newest bid on top (No rounded pills, clean broadcast layout)
  const reversed = [...currentBids].reverse();
  listEl.innerHTML = reversed.map((bid, index) => {
    const team = (s.teams || []).find(t => Number(t.teamId) === Number(bid.teamId) || Number(t.id) === Number(bid.teamId));
    const isLatest = index === 0;
    const logo = getTeamLogo(team);
    const teamName = team ? (team.name || team.short || `Team ${bid.teamId}`) : `Team ${bid.teamId}`;
    const teamColor = team ? (team.color || '#f5c542') : '#f5c542';
    const amountStr = Bus.fmtL(bid.amountL);
    const bidNumber = currentBids.length - index;

    return `
      <div class="bh-item ${isLatest ? 'latest' : ''}">
        ${logo 
          ? `<img src="${logo}" class="bh-logo" alt="${Bus.esc(teamName)}" />` 
          : `<div class="bh-logo bh-logo-fallback" style="background:${teamColor}33;color:${teamColor}">${Bus.esc(initials(teamName))}</div>`
        }
        <div class="bh-info">
          <div class="bh-team-name" style="color:${teamColor}">${Bus.esc(teamName)}</div>
          <div class="bh-amount">${amountStr}</div>
        </div>
        ${isLatest 
          ? `<span class="bh-badge">LEADER</span>` 
          : `<span class="bh-num">#${bidNumber}</span>`
        }
      </div>
    `;
  }).join('');
}

let _prevPhase = null, _themeAt = 0;
let prevBidAmount = null;
let prevLeadTeamId = null;
let lastSoldSr = null;

function render(s) {
  snap = s;
  const ph = s.phase;

  _prevPhase = ph;

  // Update Top-Left Stacked Metrics Counters (SOLD : X / UNSOLD : Y / REMAINING : Z)
  if ($('mSold')) $('mSold').textContent = s.counts ? s.counts.sold : 0;
  if ($('mUnsold')) $('mUnsold').textContent = s.counts ? s.counts.unsold : 0;
  if ($('mLeft')) $('mLeft').textContent = s.counts ? s.counts.pool : 0;

  // Unsold round banner
  const uBanner = $('unsoldBanner');
  if (uBanner) {
    uBanner.style.display = (s.round === 'unsold') ? 'block' : 'none';
  }

  const p = s.current;

  if (p) {
    $('pname').textContent = p.name;
    const catColor = '#' + ((p.cat && window.__cats && window.__cats[p.cat]) ? window.__cats[p.cat].c : '888');
    $('baseVal').textContent = Bus.fmtL(p.base);
    const overseas = p.country && p.country !== 'India';
    const meta = [];
    meta.push(`<span class="tag" style="background:${catColor}25;color:${catColor};border:1px solid ${catColor}55">${roleLabel(p)}</span>`);
    if (overseas) {
      meta.push(`<span class="tag" style="background:rgba(76,201,240,.18);color:#85b0ff;border:1px solid rgba(76,201,240,.4)">${p.country === 'Overseas' ? 'Overseas' : Bus.esc(p.country)}</span>`);
    } else if (p.country) {
      meta.push(`<span class="tag" style="background:#1b2547;color:#f0f0f0;border:1px solid rgba(255,255,255,.15)">${p.country === 'India' ? 'Indian' : Bus.esc(p.country)}</span>`);
    }
    $('pmeta').innerHTML = meta.join('');
    $('lastside').innerHTML = (p.star && p.star.team ? `Last Franchise: <b>${Bus.esc(p.star.team)}</b>` : '');
    setPhoto(p, catColor);

    // Career stats strip
    let cells;
    const st = p.stats;
    if (st && Object.keys(st).length) {
      cells = [['CAREER', 'IPL']];
      if (st.matches != null) cells.push(['MTS', st.matches]);
      if (st.runs != null) cells.push(['RUNS', st.runs]);
      if (st.average != null) cells.push(['AVG', st.average]);
      if (st.strike_rate != null) cells.push(['SR', st.strike_rate]);
      if (st.wickets != null) cells.push(['WKTS', st.wickets]);
      if (st.economy != null) cells.push(['ECON', st.economy]);
    } else {
      cells = [];
      if (p.series != null) cells.push(['SERIES', String(p.series)]);
      if (p.lot != null) cells.push(['LOT', String(p.lot)]);
      if (p.tier) cells.push(['TIER', p.tier]);
    }
    $('statStrip').innerHTML = cells.map(c => `<div class="cell"><span class="k">${Bus.esc(c[0])}</span><span class="v">${Bus.esc(c[1])}</span></div>`).join('');
    const hl = (p.star && p.star.hi) ? p.star.hi : [];
    $('hl').innerHTML = hl.map(h => `<div>${Bus.esc(h)}</div>`).join('');
  } else {
    $('pname').textContent = ph === 'complete' ? 'AUCTION COMPLETE' : (ph === 'setup' ? 'AUCTION SETUP' : 'WAITING FOR NEXT PLAYER…');
    $('baseVal').textContent = '—';
    $('pmeta').innerHTML = '';
    $('hl').innerHTML = '';
    $('lastside').innerHTML = '';
    $('statStrip').innerHTML = '';
    $('pphoto').innerHTML = '<div class="pavatar sil">' + makeSilSVG('rgba(76,201,240,0.6)') + '</div>';
  }

  // Current Bidding & Team Logo (Heartbeat Safe)
  const b = s.bidding;
  const bckLabelEl = $('bckLabel');
  const leadLogoEl = $('leadLogo');
  const leadSubEl = $('leadSub');
  const leadTeamEl = $('leadteam');

  if (b && b.currentBidL != null) {
    if (bckLabelEl) bckLabelEl.textContent = 'Current Bid';
    $('bidamt').textContent = Bus.fmtL(b.currentBidL);
    
    prevBidAmount = b.currentBidL;

    const lt = s.teams.find(t => Number(t.teamId) === Number(b.leadingTeamId) || Number(t.id) === Number(b.leadingTeamId));
    if (lt) {
      const logo = getTeamLogo(lt);
      if (logo && leadLogoEl) {
        if (!leadLogoEl.src.endsWith(logo)) {
          leadLogoEl.src = logo;
        }
        leadLogoEl.style.display = 'block';
        leadLogoEl.style.borderColor = lt.color || 'var(--gold)';
      } else if (leadLogoEl) {
        leadLogoEl.style.display = 'none';
      }
      if (leadSubEl) leadSubEl.textContent = 'LEADING BID';
      if (leadTeamEl) {
        leadTeamEl.textContent = lt.name;
        leadTeamEl.style.color = lt.color || '#fff';
      }
    } else {
      if (leadLogoEl) leadLogoEl.style.display = 'none';
      if (leadSubEl) leadSubEl.textContent = 'LEADER';
      if (leadTeamEl) leadTeamEl.textContent = '';
    }
    prevLeadTeamId = b.leadingTeamId;
  } else if (b) {
    if (bckLabelEl) bckLabelEl.textContent = 'Current Bid';
    $('bidamt').textContent = Bus.fmtL(b.baseL);
    if (leadLogoEl) leadLogoEl.style.display = 'none';
    if (leadSubEl) leadSubEl.textContent = 'STATUS';
    if (leadTeamEl) {
      leadTeamEl.textContent = 'Opening bid';
      leadTeamEl.style.color = 'var(--mut)';
    }
    prevBidAmount = null;
    prevLeadTeamId = null;
  } else {
    if (bckLabelEl) bckLabelEl.textContent = 'Current Bid';
    $('bidamt').textContent = '—';
    if (leadLogoEl) leadLogoEl.style.display = 'none';
    if (leadSubEl) leadSubEl.textContent = '';
    if (leadTeamEl) leadTeamEl.textContent = '';
    prevBidAmount = null;
    prevLeadTeamId = null;
  }

  // Update Bid History Panel (Anti-jitter protected)
  try { updateBidHistory(s); } catch(e) { console.error('[bidHistory error]', e); }

  // Render bottom franchise row (Memoized to prevent flickering)
  try { renderTeams(s); } catch(e) { console.error('[renderTeams error]', e); }
  tick();
  if (s.bidding && s.bidding.sr && lastSoldSr && s.bidding.sr !== lastSoldSr) {
    closeSplash();
  }
  try { checkResult(s); } catch(e) { console.error('[checkResult error]', e); }
}

// Full-screen resolution moment & Roster Transition
let lastResTs = 0, splashT = null, stageSwitchT = null, progInterval = null, rosterProgInterval = null;
let currentSplashStage = 'sold';

function startRosterProgress() {
  clearInterval(rosterProgInterval);
  const rBar = $('sp-roster-progress-bar');
  const rTimer = $('sp-roster-timer-label');
  if (rBar) rBar.style.width = '0%';
  const r0 = Date.now();
  const dur = 8000;
  rosterProgInterval = setInterval(() => {
    const elap = Date.now() - r0;
    const pct = Math.min(100, (elap / dur) * 100);
    if (rBar) rBar.style.width = pct + '%';
    const rem = Math.max(1, Math.ceil((dur - elap) / 1000));
    if (rTimer) rTimer.textContent = `CLOSING IN ${rem}s`;
    if (elap >= dur) clearInterval(rosterProgInterval);
  }, 40);
}

function switchSplashStage(stage) {
  currentSplashStage = stage;
  const soldStage = $('sp-stage-sold');
  const rosterStage = $('sp-stage-roster');
  const pillSold = $('sp-pill-sold');
  const pillRoster = $('sp-pill-roster');

  if (stage === 'sold') {
    if (soldStage) { soldStage.classList.remove('leave-prev'); soldStage.classList.add('active'); }
    if (rosterStage) { rosterStage.classList.remove('active'); rosterStage.classList.add('leave-prev'); }
    if (pillSold) pillSold.classList.add('active');
    if (pillRoster) pillRoster.classList.remove('active');
  } else if (stage === 'roster') {
    if (soldStage) { soldStage.classList.remove('active'); soldStage.classList.add('leave-prev'); }
    if (rosterStage) { rosterStage.classList.remove('leave-prev'); rosterStage.classList.add('active'); }
    if (pillSold) pillSold.classList.remove('active');
    if (pillRoster) pillRoster.classList.add('active');
    startRosterProgress();
  }
}
window.switchSplashStage = switchSplashStage;

function closeSplash() {
  clearTimeout(splashT); splashT = null;
  clearTimeout(stageSwitchT); stageSwitchT = null;
  clearInterval(progInterval); progInterval = null;
  clearInterval(rosterProgInterval); rosterProgInterval = null;
  stopTheme(); // stop theme song playback if modal is closed
  const el = $('soldsplash');
  if (el) el.classList.remove('show');
  setTimeout(() => {
    const s1 = $('sp-stage-sold'), s2 = $('sp-stage-roster');
    if (s1) s1.className = 'sp-stage sp-stage-sold active';
    if (s2) s2.className = 'sp-stage sp-stage-roster';
    const bar = $('sp-progress-bar');
    if (bar) bar.style.width = '0%';
    const rBar = $('sp-roster-progress-bar');
    if (rBar) rBar.style.width = '0%';
  }, 450);
}
window.closeSplash = closeSplash;

const closeBtn = $('sp-close-btn');
if (closeBtn) closeBtn.onclick = closeSplash;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.code === 'Space') {
    const el = $('soldsplash');
    if (el && el.classList.contains('show')) closeSplash();
  }
});

const ROLE_THEMES = {
  'BATTER': { bg: 'rgba(230,57,70,0.25)', border: '#e63946', color: '#ff9aa2', icon: '🏏' },
  'BOWLER': { bg: 'rgba(53,196,106,0.25)', border: '#35c46a', color: '#7ee0a1', icon: '🎯' },
  'ALL-ROUNDER': { bg: 'rgba(155,93,229,0.25)', border: '#9b5de5', color: '#cb9bff', icon: '⚡' },
  'WICKETKEEPER': { bg: 'rgba(46,196,182,0.25)', border: '#2ec4b6', color: '#70efe3', icon: '🧤' },
};

function checkResult(s) {
  const r = s.lastResult;
  if (!r) return;
  if (r.ts === lastResTs) return;
  const isInitial = (lastResTs === 0);
  lastResTs = r.ts;
  if (isInitial && Math.abs(Date.now() - r.ts) > 15000) return;



  clearTimeout(splashT);
  clearTimeout(stageSwitchT);
  clearInterval(progInterval);
  clearInterval(rosterProgInterval);

  const sold = r.kind === 'sold';
  if (sold) lastSoldSr = r.sr;

  const stamp = $('sp-stamp');
  const col = r.kind === 'sold' ? '#2ec46a' : (r.kind === 'unsold' ? '#e74c3c' : '#f4c430');
  if (stamp) {
    stamp.className = 'stamp ' + r.kind;
    stamp.textContent = r.kind === 'sold' ? 'SOLD' : (r.kind === 'unsold' ? 'UNSOLD' : 'SKIPPED');
  }
  const photoEl = $('sp-photo');
  if (photoEl) fillPhoto(photoEl, r.name, r.teamColor || col, r.photo);
  if ($('sp-name')) $('sp-name').textContent = r.name || '';

  const spTeamCard = $('sp-team-card');
  const spLogoEl = $('sp-team-logo');
  const progBox = $('sp-progress-box');
  const navPills = $('sp-nav-pills');

  if (spTeamCard) spTeamCard.style.display = sold ? 'flex' : 'none';
  if ($('sp-price')) $('sp-price').style.display = sold ? '' : 'none';
  if ($('sp-sub')) $('sp-sub').style.display = sold ? 'none' : '';

  if (sold) {
    const teamObj = (s.teams || []).find(t => Number(t.teamId != null ? t.teamId : t.id) === Number(r.teamId));
    const teamLogo = getTeamLogo(teamObj || { name: r.teamName, short: r.teamShort });
    const tCol = r.teamColor || (teamObj ? teamObj.color : 'var(--gold)');

    // Stage 1 Celebration setup
    if ($('sp-team')) {
      $('sp-team').textContent = r.teamName || (teamObj ? teamObj.name : '');
      $('sp-team').style.color = tCol;
    }
    if ($('sp-price')) $('sp-price').textContent = Bus.fmtL(r.priceL);
    if (spTeamCard) spTeamCard.style.borderColor = tCol;
    if (teamLogo && spLogoEl) {
      spLogoEl.src = teamLogo;
      spLogoEl.style.display = 'block';
      spLogoEl.style.borderColor = tCol;
    } else if (spLogoEl) {
      spLogoEl.style.display = 'none';
    }

    // Stage 2 Roster Showcase setup
    const rCard = $('sp-roster-card');
    if (rCard) rCard.style.setProperty('--t-color', tCol);
    if ($('sp-roster-team-name')) {
      $('sp-roster-team-name').textContent = r.teamName || (teamObj ? teamObj.name : 'TEAM');
      $('sp-roster-team-name').style.color = tCol;
    }
    const rLogo = $('sp-roster-logo');
    if (teamLogo && rLogo) {
      rLogo.src = teamLogo;
      rLogo.style.display = 'block';
      rLogo.style.borderColor = tCol;
    } else if (rLogo) {
      rLogo.style.display = 'none';
    }

    const squad = (teamObj && teamObj.squad) ? teamObj.squad : [];
    const squadCount = squad.length || (teamObj ? teamObj.count : 1);
    const squadMax = (s.settings && s.settings.squadMax) || 25;
    const overseasCount = teamObj ? teamObj.overseas : 0;
    const overseasMax = (s.settings && s.settings.overseasMax) || 8;
    const remL = teamObj ? teamObj.remaining : 0;
    const spentL = teamObj ? teamObj.spent : r.priceL;

    if ($('sp-pill-roster-text')) {
      const shortName = teamObj ? teamObj.short || teamObj.name : 'Team';
      $('sp-pill-roster-text').textContent = `${shortName} Roster (${squadCount})`;
    }

    if ($('sp-roster-stats-strip')) {
      $('sp-roster-stats-strip').innerHTML = `
        <div class="sp-roster-stat-pill">
          <span class="k">SQUAD SIZE</span>
          <span class="v">${squadCount} / ${squadMax}</span>
        </div>
        <div class="sp-roster-stat-pill">
          <span class="k">OVERSEAS</span>
          <span class="v">${overseasCount} / ${overseasMax}</span>
        </div>
        <div class="sp-roster-stat-pill">
          <span class="k">PURSE LEFT</span>
          <span class="v gold">${Bus.fmtL(remL)}</span>
        </div>
        <div class="sp-roster-stat-pill">
          <span class="k">TOTAL SPENT</span>
          <span class="v">${Bus.fmtL(spentL)}</span>
        </div>
      `;
    }

    // Role count chips
    const roleCounts = { 'BATTER': 0, 'BOWLER': 0, 'ALL-ROUNDER': 0, 'WICKETKEEPER': 0 };
    squad.forEach(p => {
      const role = (p.role || '').toUpperCase();
      if (roleCounts[role] !== undefined) roleCounts[role]++;
    });
    const roleChips = [];
    if (roleCounts['BATTER']) roleChips.push(`<span class="sp-role-chip" style="background:rgba(230,57,70,0.18);border:1px solid #e63946;color:#ff8a93">🏏 ${roleCounts['BATTER']} BAT</span>`);
    if (roleCounts['BOWLER']) roleChips.push(`<span class="sp-role-chip" style="background:rgba(53,196,106,0.18);border:1px solid #35c46a;color:#7ee0a1">🎯 ${roleCounts['BOWLER']} BOWL</span>`);
    if (roleCounts['ALL-ROUNDER']) roleChips.push(`<span class="sp-role-chip" style="background:rgba(155,93,229,0.18);border:1px solid #9b5de5;color:#cb9bff">⚡ ${roleCounts['ALL-ROUNDER']} ALL-R</span>`);
    if (roleCounts['WICKETKEEPER']) roleChips.push(`<span class="sp-role-chip" style="background:rgba(46,196,182,0.18);border:1px solid #2ec4b6;color:#70efe3">🧤 ${roleCounts['WICKETKEEPER']} WK</span>`);
    if ($('sp-roster-breakdown')) {
      $('sp-roster-breakdown').innerHTML = roleChips.join('') || '<span class="sp-role-chip" style="color:var(--mut)">Squad in formation</span>';
    }

    // Squad player cards (newly signed player placed first with prominent BIG photo)
    const sortedSquad = squad.slice().sort((a, b) => {
      const aIsNew = Number(a.sr) === Number(r.sr);
      const bIsNew = Number(b.sr) === Number(r.sr);
      if (aIsNew && !bIsNew) return -1;
      if (!aIsNew && bIsNew) return 1;
      return (b.priceL || 0) - (a.priceL || 0);
    });

    if ($('sp-roster-grid')) {
      $('sp-roster-grid').innerHTML = sortedSquad.map(p => {
        const isNew = Number(p.sr) === Number(r.sr);
        const roleKey = (p.role || '').toUpperCase();
        const rt = ROLE_THEMES[roleKey] || { bg: 'rgba(255,255,255,0.12)', border: '#888', color: '#ccc', icon: '🏏' };
        const thumbImg = p.photo 
          ? `<img src="${p.photo}" alt="${Bus.esc(p.name)}" onerror="this.parentElement.innerHTML=makeSilSVG('${tCol}')" />` 
          : makeSilSVG(tCol);
        return `
          <div class="sp-player-card ${isNew ? 'new-signing' : ''}">
            ${isNew ? '<div class="sp-card-new-ribbon">★ JUST SIGNED ★</div>' : ''}
            <div class="sp-player-card-media">
              <div class="sp-card-badges">
                <span class="sp-card-role-badge" style="background:${rt.bg};border:1px solid ${rt.border};color:${rt.color}">
                  ${rt.icon} ${Bus.esc(p.role || 'PLAYER')}
                </span>
                ${p.overseas ? '<span class="sp-card-os-badge" title="Overseas Player">✈ OS</span>' : ''}
              </div>
              <div class="sp-player-photo-wrap">
                ${thumbImg}
              </div>
            </div>
            <div class="sp-player-card-details">
              <div class="sp-card-player-name" title="${Bus.esc(p.name)}">${Bus.esc(p.name)}</div>
              <div class="sp-card-bottom-row">
                <span class="sp-card-country">${p.overseas ? (Bus.esc(p.country || 'Overseas')) : 'India'}</span>
                <span class="sp-card-price">${Bus.fmtL(p.priceL)}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    if (progBox) progBox.style.display = 'flex';
    if (navPills) navPills.style.display = 'flex';
    switchSplashStage('sold');

    // SOLD stage: exactly 3.0 seconds (3000ms) with countdown bar
    const progBar = $('sp-progress-bar');
    if (progBar) progBar.style.width = '0%';
    const startT = Date.now();
    const switchDur = 3000;
    progInterval = setInterval(() => {
      const elapsed = Date.now() - startT;
      const pct = Math.min(100, (elapsed / switchDur) * 100);
      if (progBar) progBar.style.width = pct + '%';
      const rem = Math.max(1, Math.ceil((switchDur - elapsed) / 1000));
      if ($('sp-next-timer')) $('sp-next-timer').textContent = `${rem}s`;
      if (elapsed >= switchDur) clearInterval(progInterval);
    }, 30);

    // After 3 seconds, smoothly switch to the Roster Showcase
    stageSwitchT = setTimeout(() => {
      switchSplashStage('roster');
    }, switchDur);

    // Total display duration: 3 seconds (Sold) + 8 seconds (Roster) = 11 seconds (11000ms)
    splashT = setTimeout(() => {
      closeSplash();
    }, 11000);

  } else {
    // Unsold or Skipped
    if (spLogoEl) spLogoEl.style.display = 'none';
    if (progBox) progBox.style.display = 'none';
    if (navPills) navPills.style.display = 'none';
    if ($('sp-sub')) $('sp-sub').textContent = r.kind === 'unsold' ? 'went unsold' : 'set aside — will return later';
    switchSplashStage('sold');
    splashT = setTimeout(() => { closeSplash(); }, 3000);
  }

  const el = $('soldsplash');
  if (el) el.classList.add('show');
}

function roleLabel(p) { return p.role || ''; }
function initials(name) { return String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?'; }

let _silUid = 0;
function makeSilSVG(accentColor) {
  const c = accentColor || 'rgba(76, 201, 240, 0.7)';
  const id = ++_silUid;
  return '<svg viewBox="0 0 100 100" class="player-sil-svg" preserveAspectRatio="xMidYMid meet">'
    + '<defs>'
    + '<linearGradient id="silHeadGrad_' + id + '" x1="0%" y1="0%" x2="0%" y2="100%">'
    + '<stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>'
    + '<stop offset="100%" stop-color="' + c + '" stop-opacity="0.45"/>'
    + '</linearGradient>'
    + '<linearGradient id="silTorsoGrad_' + id + '" x1="0%" y1="0%" x2="0%" y2="100%">'
    + '<stop offset="0%" stop-color="' + c + '" stop-opacity="0.5"/>'
    + '<stop offset="100%" stop-color="#081020" stop-opacity="0.95"/>'
    + '</linearGradient>'
    + '</defs>'
    + '<path d="M4 100 C6 74 21 57 41 50 L43 43 L57 43 L59 50 C79 57 94 74 96 100 Z" fill="url(#silTorsoGrad_' + id + ')"/>'
    + '<path d="M41 50 Q50 63 59 50" fill="none" stroke="' + c + '" stroke-width="2.6" stroke-linecap="round"/>'
    + '<path d="M50 14 C58.8 14 66 21.2 66 30 C66 37.8 60.5 44.2 53.4 45.6 L53.4 46.5 L46.6 46.5 L46.6 45.6 C39.5 44.2 34 37.8 34 30 C34 21.2 41.2 14 50 14 Z" fill="url(#silHeadGrad_' + id + ')"/>'
    + '</svg>';
}

function fillPhoto(box, name, color, photo) {
  box.innerHTML = '';
  const ph = document.createElement('div');
  ph.className = 'pavatar sil';
  ph.innerHTML = makeSilSVG(color);
  box.appendChild(ph);
  if (photo) {
    const img = new Image();
    img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
    img.onerror = () => {};
    img.src = photo;
  }
}
function setPhoto(p, color) { fillPhoto($('pphoto'), p.name, color || '#555555', p.photo); }

// Memoized teams render to avoid layout thrashing on every 1s heartbeat
let _lastTeamsSig = null;
function renderTeams(s) {
  const lead = s.bidding ? Number(s.bidding.leadingTeamId) : null;
  const online = new Set(((s.presence && s.presence.teams) || []).map(Number));
  
  const currentSig = (s.teams || []).map(t => `${t.teamId || t.id}_${t.remaining}_${t.count}_${online.has(Number(t.teamId || t.id))}`).join('|') + `_lead:${lead}`;
  if (currentSig === _lastTeamsSig) {
    return; // Unchanged: avoid repainting
  }
  _lastTeamsSig = currentSig;

  $('teams').innerHTML = s.teams.map(t => {
    const tid = Number(t.teamId != null ? t.teamId : t.id);
    const c = Bus.esc(t.color || '#888');
    const isOn = online.has(tid);
    const isLeading = tid === lead;
    const dot = `<span class="onl ${isOn ? 'on' : ''}" title="${isOn ? 'Online' : 'Offline'}"></span>`;
    const logo = getTeamLogo(t);
    const logoHtml = logo 
      ? `<img src="${logo}" class="tcard-logo" alt="${Bus.esc(t.short || t.name)}" />` 
      : `<span class="swatch" style="background:${c};color:${c}"></span>`;
    return `
    <div class="tcard ${isLeading ? 'lead' : ''}" style="--tc:${c}">
      <div class="tn">${dot}${logoHtml}<span>${Bus.esc(t.name)}</span></div>
      <div class="rem mono">${Bus.fmtL(t.remaining)}</div>
      <div class="sub">${Bus.plural(t.count, 'player')} · ${t.overseas} os · spent ${Bus.fmtL(t.spent)}</div>
    </div>`;
  }).join('');
}

// Timer tick (countdown strictly updates ring/text without re-rendering panels)
let endsAt = null, dur = 0;
function tick() {
  const t = snap && snap.timer;
  if (t && t.running && t.remainingMs > 0) {
    endsAt = Date.now() + t.remainingMs;
    dur = t.durationMs;
  } else if (!(t && t.running)) {
    endsAt = null;
  }
}
let lastSec = null;
setInterval(() => {
  const ring = $('ring'), num = $('ringnum');
  if (endsAt) {
    const rem = Math.max(0, endsAt - Date.now());
    const sec = Math.ceil(rem / 1000);
    num.textContent = sec;
    ring.style.setProperty('--p', dur ? (rem / dur * 100) : 0);
    ring.style.filter = 'none';
    num.style.color = sec <= 5 ? '#e74c3c' : 'var(--ink)';
    lastSec = sec;
  } else {
    num.textContent = '—';
    num.style.color = 'var(--ink)';
    ring.style.setProperty('--p', 0);
    ring.style.filter = 'none';
    lastSec = null;
  }
}, 100);

// Boot
if (!Bus.ROOM) {
  document.body.innerHTML = '<div class="noroom"><div class="card">'
    + '<div class="brand" style="justify-content:center;margin-bottom:14px"><div class="logo">IPL</div>'
    + '<div><small>Auction · 2026</small><div style="font-weight:800">Broadcast screen</div></div></div>'
    + '<h2>No auction selected</h2>'
    + '<p>Add <code>?room=CODE</code> to the address to view an auction.</p>'
    + '<a href="index.html">← Back to auctions</a></div></div>';
} else {
  Bus.getJSON('/api/players').then(d => {
    window.__cats = d.cats;
    if (snap) render(snap);
  }).catch(() => {});
  // role: screen; pass no-op callback to prevent "● live" conn badge in top right
  Bus.connect(render, () => {}, { role: 'screen' });
}
</script>
</body>
